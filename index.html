<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamearchief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: archiefkast. Titelblok met telling, plakkerige zoekbalk, zijbalk met games, kaartenraster met thumbnails. */
:root {
  --bg: #ECEEF3;
  --surface: #FFFFFF;
  --field: #F5F6FA;
  --fg: #15171F;
  --muted: #5B6072;
  --line: #D6D9E3;
  --accent: #D42E1C;
  --accent-fg: #FFFFFF;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1016; --surface: #171A22; --field: #10131A; --fg: #ECEEF4;
    --muted: #9BA1B3; --line: #282C39; --accent: #FF6A55; --accent-fg: #1A0A07;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 24px 64px;
}
.wrap { max-width: 1280px; margin-inline: auto; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }

.top { padding-bottom: 20px; }
h1 { font: 700 clamp(2.2rem, 7vw, 3.6rem)/1 var(--font-display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.tally { margin: 10px 0 0; font: 400 12px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tally b { color: var(--accent); font-weight: 500; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 500; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; border-block: 1px solid var(--line); margin-bottom: 20px; }
.bar .search { flex: 1 1 220px; min-width: 0; }
.bar select, .bar input { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; width: 100%; min-width: 0; }
.bar select { width: auto; flex: 0 1 auto; max-width: 100%; }
.bar .gamepick { display: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--field); }
.seg button { border: 0; background: transparent; padding: 9px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.games { position: sticky; top: 74px; max-height: calc(100vh - 96px); overflow: auto; padding-right: 6px; }
.games h2 { font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.games button { display: flex; width: 100%; justify-content: space-between; gap: 10px; align-items: baseline; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.games button:hover { background: var(--surface); }
.games button[aria-current="true"] { background: var(--fg); color: var(--bg); }
.games .gname { min-width: 0; overflow-wrap: anywhere; }
.games .n { font: 400 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.games button[aria-current="true"] .n { color: inherit; opacity: .75; }
.info { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; font: 400 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; letter-spacing: inherit; text-transform: inherit; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 20px 14px; }
@media (max-width: 460px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; } }
.card { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.cover { --h: 200; position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; color: #fff; text-decoration: none;
  background: repeating-linear-gradient(135deg, rgb(255 255 255 / .06) 0 10px, transparent 10px 20px), linear-gradient(140deg, hsl(var(--h) 52% 36%), hsl(calc(var(--h) + 35) 58% 20%)); }
.cover .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 700 clamp(1.6rem, 4vw, 2.3rem)/1 var(--font-display); letter-spacing: .04em; text-shadow: 0 2px 10px rgb(0 0 0 / .35); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .play { position: absolute; right: 8px; bottom: 8px; width: 24px; height: 24px; background: rgb(255 255 255 / .92); clip-path: polygon(15% 8%, 92% 50%, 15% 92%); opacity: 0; transition: opacity .15s; }
a.cover:hover .play, a.cover:focus-visible .play { opacity: 1; }
.card h3 { margin: 0; font: 600 14px/1.35 var(--font-body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; font: 400 12px/1.4 var(--font-mono); color: var(--muted); }
.meta .g { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--fg); font: 500 12px var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.meta .g:hover { color: var(--accent); }

.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { --h: 200; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 9px; border-bottom: 1px solid var(--line); }
.row .cover { border-radius: 4px; }
.row .cover .ini { font-size: 1rem; }
.row .t { min-width: 0; }
.row .t a { font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.row .t a:hover { text-decoration: underline; }
.row .t .meta { justify-content: flex-start; gap: 2px 12px; }
.row .d { font: 400 12px var(--font-mono); color: var(--muted); }
@media (max-width: 460px) { .row { grid-template-columns: 76px minmax(0, 1fr); } .row .d { grid-column: 2; } }

.more { display: flex; justify-content: center; margin-top: 26px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 36px 20px; text-align: center; background: var(--surface); }
.empty h2 { font: 700 1.5rem/1.2 var(--font-display); margin: 0 0 8px; }
.empty p { max-width: 52ch; margin: 0 auto 16px; color: var(--muted); }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .games { display: none; }
  .bar .gamepick { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Gamearchief</h1>
    <p class="tally" id="tally">Catalogus laden</p>
  </header>

  <div class="bar" role="search">
    <div class="search"><input id="q" type="search" placeholder="Zoek op titel, game of notitie" aria-label="Zoeken"></div>
    <select id="gamepick" class="gamepick" aria-label="Game"></select>
    <select id="sort" aria-label="Sorteren">
      <option value="new">Nieuwste eerst</option>
      <option value="old">Oudste eerst</option>
      <option value="game">Game A-Z</option>
      <option value="title">Titel A-Z</option>
    </select>
    <div class="seg" role="group" aria-label="Weergave">
      <button type="button" id="vGrid" aria-pressed="true">Raster</button>
      <button type="button" id="vList" aria-pressed="false">Lijst</button>
    </div>
  </div>

  <div class="layout">
    <aside class="games" id="games" aria-label="Games"></aside>
    <main>
      <div class="info" id="info"></div>
      <div id="out"></div>
      <div class="more" id="more" hidden><button class="btn" type="button" data-act="more">Toon meer</button></div>
    </main>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var videos = [], loaded = false;
  var S = { q: '', game: '', sort: 'new', view: 'grid', limit: 60 };
  try { var sv = localStorage.getItem('ga-view'); if (sv === 'list' || sv === 'grid') S.view = sv; } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function gkey(g) { return String(g || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
  function gclean(g) { return String(g || '').trim().replace(/\s+/g, ' '); }
  function hue(g) { var h = 7, k = gkey(g); for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0; return h % 360; }
  function initials(g) {
    var w = gclean(g).split(' ').filter(Boolean);
    if (!w.length) return '?';
    if (w.length === 1) return w[0].slice(0, 3).toUpperCase();
    return w.slice(0, 3).map(function (x) { return x[0]; }).join('').toUpperCase();
  }
  function fmtDate(d) {
    if (!d) return '';
    var p = String(d).split('-'); if (p.length !== 3) return esc(d);
    var m = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
    return (+p[2]) + ' ' + (m[+p[1] - 1] || '') + ' ' + p[0];
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function ytId(u) {
    var m = String(u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  function gameStats() {
    var map = {};
    videos.forEach(function (v) {
      var k = gkey(v.game) || 'overig';
      if (!map[k]) map[k] = { key: k, name: gclean(v.game) || 'Overig', n: 0 };
      map[k].n++;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name); });
  }

  function filtered() {
    var q = S.q.trim().toLowerCase();
    var out = videos.filter(function (v) {
      if (S.game && (gkey(v.game) || 'overig') !== S.game) return false;
      if (!q) return true;
      return (String(v.title || '') + ' ' + String(v.game || '') + ' ' + String(v.note || '')).toLowerCase().indexOf(q) !== -1;
    });
    var cmp = function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); };
    if (S.sort === 'new') out.sort(function (a, b) { if (!a.date !== !b.date) return a.date ? -1 : 1; return cmp(a, b); });
    else if (S.sort === 'old') out.sort(function (a, b) { if (!a.date !== !b.date) return a.date ? -1 : 1; return -cmp(a, b); });
    else if (S.sort === 'game') out.sort(function (a, b) { return gclean(a.game).localeCompare(gclean(b.game)) || String(a.title).localeCompare(String(b.title)); });
    else out.sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); });
    return out;
  }

  /* Thumbnail ligt boven het gekleurde blok. Laadt het plaatje niet, dan blijft het blok met initialen staan. */
  function coverHtml(v, g) {
    var u = safeUrl(v.url), id = ytId(v.url);
    var img = id ? '<img src="https://i.ytimg.com/vi/' + id + '/mqdefault.jpg" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">' : '';
    var inner = '<span class="ini">' + esc(initials(g)) + '</span>' + img + (u ? '<span class="play"></span>' : '');
    var st = ' style="--h:' + hue(g) + '"';
    return u ? '<a class="cover" href="' + esc(u) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"' + st + '>' + inner + '</a>' : '<div class="cover"' + st + '>' + inner + '</div>';
  }
  function titleHtml(v) {
    var u = safeUrl(v.url);
    return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(v.title) + '</a>' : esc(v.title);
  }
  function cardHtml(v) {
    var g = gclean(v.game) || 'Overig';
    return '<article class="card">' + coverHtml(v, g) + '<h3>' + titleHtml(v) + '</h3><div class="meta"><button class="g" type="button" data-game="' + esc(gkey(g)) + '">' + esc(g) + '</button><time>' + fmtDate(v.date) + '</time></div></article>';
  }
  function rowHtml(v) {
    var g = gclean(v.game) || 'Overig';
    return '<div class="row">' + coverHtml(v, g) + '<div class="t"><b>' + titleHtml(v) + '</b><div class="meta"><button class="g" type="button" data-game="' + esc(gkey(g)) + '">' + esc(g) + '</button>' + (v.note ? '<span>' + esc(v.note) + '</span>' : '') + '</div></div><div class="d"><time>' + fmtDate(v.date) + '</time></div></div>';
  }

  function render() {
    var stats = gameStats();
    var dated = videos.filter(function (v) { return v.date; }).map(function (v) { return v.date; }).sort();
    var last = dated.length ? ' &middot; Laatste upload ' + fmtDate(dated[dated.length - 1]) : '';
    $('tally').innerHTML = loaded ? '<b>' + videos.length + '</b> video’s &middot; <b>' + stats.length + '</b> games' + last : 'Catalogus laden';

    var gh = '<h2>Games</h2><button type="button" data-game="" aria-current="' + (!S.game) + '"><span class="gname">Alle games</span><span class="n">' + videos.length + '</span></button>';
    stats.forEach(function (g) { gh += '<button type="button" data-game="' + esc(g.key) + '" aria-current="' + (S.game === g.key) + '"><span class="gname">' + esc(g.name) + '</span><span class="n">' + g.n + '</span></button>'; });
    $('games').innerHTML = gh;
    var pick = '<option value="">Alle games (' + videos.length + ')</option>';
    stats.forEach(function (g) { pick += '<option value="' + esc(g.key) + '"' + (S.game === g.key ? ' selected' : '') + '>' + esc(g.name) + ' (' + g.n + ')</option>'; });
    $('gamepick').innerHTML = pick;
    $('vGrid').setAttribute('aria-pressed', S.view === 'grid');
    $('vList').setAttribute('aria-pressed', S.view === 'list');

    var out = $('out'), more = $('more');
    if (!loaded) { out.innerHTML = ''; $('info').innerHTML = ''; more.hidden = true; return; }
    if (!videos.length) { $('info').innerHTML = ''; out.innerHTML = '<div class="empty"><h2>Nog geen video’s</h2><p>Zet video’s in videos.json naast deze pagina.</p></div>'; more.hidden = true; return; }
    var list = filtered(), shown = list.slice(0, S.limit), active = S.q || S.game;
    $('info').innerHTML = '<span>' + (active ? list.length + ' van ' + videos.length : videos.length) + ' video’s</span>' + (active ? '<button class="link" type="button" data-act="clear">Wis filters</button>' : '');
    if (!list.length) { out.innerHTML = '<div class="empty"><h2>Geen resultaat</h2><p>Er is geen video die past bij deze zoekopdracht.</p><button class="btn" type="button" data-act="clear">Wis filters</button></div>'; more.hidden = true; return; }
    out.innerHTML = S.view === 'grid' ? '<div class="grid">' + shown.map(cardHtml).join('') + '</div>' : '<div class="list">' + shown.map(rowHtml).join('') + '</div>';
    more.hidden = list.length <= shown.length;
    if (!more.hidden) more.firstElementChild.textContent = 'Toon meer (' + (list.length - shown.length) + ' te gaan)';
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act],[data-game]'); if (!el) return;
    if (el.hasAttribute('data-game')) { S.game = el.getAttribute('data-game'); S.limit = 60; render(); window.scrollTo({ top: 0 }); return; }
    var a = el.getAttribute('data-act');
    if (a === 'more') { S.limit += 60; render(); }
    else if (a === 'clear') { S.q = ''; S.game = ''; S.limit = 60; $('q').value = ''; render(); }
  });
  var qt = 0;
  $('q').addEventListener('input', function () { clearTimeout(qt); var v = this.value; qt = setTimeout(function () { S.q = v; S.limit = 60; render(); }, 120); });
  $('sort').addEventListener('change', function () { S.sort = this.value; S.limit = 60; render(); });
  $('gamepick').addEventListener('change', function () { S.game = this.value; S.limit = 60; render(); });
  function setView(v) { S.view = v; try { localStorage.setItem('ga-view', v); } catch (e) {} render(); }
  $('vGrid').addEventListener('click', function () { setView('grid'); });
  $('vList').addEventListener('click', function () { setView('list'); });

  render();
  fetch('videos.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { videos = Array.isArray(data) ? data : []; loaded = true; render(); })
    .catch(function () {
      loaded = true; render();
      $('out').innerHTML = '<div class="empty"><h2>videos.json kan niet worden geladen</h2><p>Open deze pagina via je hosting. Als je het bestand dubbelklikt op je computer, blokkeert de browser het inladen van videos.json.</p></div>';
    });
})();
</script>
</body>
</html>
